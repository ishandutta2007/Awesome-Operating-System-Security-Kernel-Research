<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d192e" />
      <stop offset="100%" stop-color="#070c16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9900ef" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14233c" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d1829" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.65; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .orb-anim {
      transform-origin: center;
      animation: pulseOrb 8s ease-in-out infinite alternate;
    }
    .radar-arm {
      transform-origin: 980px 180px;
      animation: radarScan 10s linear infinite;
    }
    .beam-stream {
      stroke-dasharray: 40 160;
      animation: beamFlow 5s linear infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Ambient Orbs in Deep Background -->
  <g class="orb-anim">
    <circle cx="200" cy="80" r="160" fill="#0052d4" opacity="0.15" filter="url(#glow)" />
    <circle cx="1020" cy="220" r="140" fill="#7000ff" opacity="0.18" filter="url(#glow)" />
    <circle cx="600" cy="320" r="120" fill="#00f2fe" opacity="0.10" filter="url(#glow)" />
  </g>

  <!-- Technical Circuit Grid Lines in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="760" y1="0" x2="760" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Animated Signal Streams -->
  <path d="M 0 120 L 400 120 L 460 180 L 800 180 L 860 240 L 1200 240" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="beam-stream" />
  <path d="M 0 260 L 320 260 L 380 200 L 720 200 L 780 140 L 1200 140" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="beam-stream" style="animation-duration: 7s;" />

  <!-- Right Side: Kernel Radar / Introspection Scope Indicator -->
  <g opacity="0.8">
    <circle cx="980" cy="180" r="105" fill="none" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="980" cy="180" r="75" fill="none" stroke="#2563eb" stroke-dasharray="4 6" stroke-width="1.5" opacity="0.6" />
    <circle cx="980" cy="180" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <circle cx="980" cy="180" r="15" fill="#00f2fe" opacity="0.4" />

    <!-- Radar Crosshairs -->
    <line x1="860" y1="180" x2="1100" y2="180" stroke="#1e3a5f" stroke-width="1" />
    <line x1="980" y1="60" x2="980" y2="300" stroke="#1e3a5f" stroke-width="1" />

    <!-- Rotating Radar Beam -->
    <g class="radar-arm">
      <line x1="980" y1="180" x2="1085" y2="180" stroke="url(#cyanPurple)" stroke-width="2" filter="url(#softGlow)" />
      <polygon points="980,180 1085,160 1085,180" fill="url(#cyanPurple)" opacity="0.15" />
    </g>

    <!-- Detected Security Nodes -->
    <circle cx="940" cy="140" r="4" fill="#00ffcc" filter="url(#softGlow)" />
    <circle cx="1030" cy="150" r="3.5" fill="#38bdf8" />
    <circle cx="950" cy="225" r="4" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="1020" cy="215" r="3" fill="#f43f5e" />
  </g>

  <!-- Left/Center Content: Strictly In Foreground for Maximum Readability -->
  <g transform="translate(80, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#00f2fe" filter="url(#softGlow)" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">KERNEL &amp; OS INTERNALS</text>
    </g>

    <!-- Main Title (Crisp, High Contrast, Foreground) -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome OS Security &amp;
    </text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#cyanPurple)" letter-spacing="-0.5" filter="url(#softGlow)">
      Kernel Research
    </text>

    <!-- Subtitle (Clear, Accessible Foreground) -->
    <text x="0" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated EDR/XDR Platforms, eBPF Telemetry, Rootkit Detection &amp; Low-Level Internals
    </text>

    <!-- Floating Dynamic Badges (Positioned cleanly below text) -->
    <g transform="translate(0, 252)">
      <!-- Pill 1: eBPF Telemetry -->
      <g class="pill-1">
        <rect width="138" height="34" rx="17" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.2" />
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">⚡ eBPF Telemetry</text>
      </g>

      <!-- Pill 2: Rootkit Detection -->
      <g transform="translate(150, 0)" class="pill-2">
        <rect width="150" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fae8ff">🛡️ Rootkit Defense</text>
      </g>

      <!-- Pill 3: Kernel Fuzzing -->
      <g transform="translate(312, 0)" class="pill-3">
        <rect width="144" height="34" rx="17" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d1fae5">🔬 Kernel Fuzzing</text>
      </g>

      <!-- Pill 4: Memory Forensics -->
      <g transform="translate(468, 0)" class="pill-1">
        <rect width="160" height="34" rx="17" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />
        <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">🔍 Memory Forensics</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight Accents -->
  <line x1="24" y1="360" x2="360" y2="360" stroke="url(#cyanPurple)" stroke-width="3" />
</svg>
